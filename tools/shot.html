<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>回声防线 · 界面截图页</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%;
               background: #04060d; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- 无头 Chrome 的 --screenshot 会被主循环的 rAF 顶住不退出，所以改成
     同步阶段把 canvas 转成 dataURL 写进 DOM，用 --dump-dom 取回来再解码。 -->
<div id="out" style="display:none"></div>

<!-- 加载顺序与 index.html 完全一致 -->
<script src="../js/runtime.js"></script>
<script src="../js/util.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/config.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/codex.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/grid.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/enemies.js"></script>
<script src="../js/monsters.js"></script>
<script src="../js/towers.js"></script>
<script src="../js/resonance.js"></script>
<script src="../js/waves.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/render.js"></script>
<script src="../js/main.js"></script>
<script>
/*
 * 给无头 Chrome 拍图用：?scene=game|monsters|tech|menu|set|help|over|win|codex|pop&wx=1
 *   codex 另有 &tab=0|1 &sel=<key> &seen=<逗号分隔|all>
 *   pop   另有 &key=<怪物 key>
 *   wx=1 时模拟微信安全区（状态栏 + 右上角胶囊），用来肉眼验收顶部适配。
 *
 * 关键点：不要在 rAF 里等 —— 无头下直接同步推进若干帧再画一帧，
 * 这样 --screenshot 一到就能拿到稳定画面（与 boot-selftest 同一套路）。
 */
(function () {
  var q = new URLSearchParams(location.search);
  var scene = q.get('scene') || 'game';
  var G = window.ECHO_TD;

  if (q.get('wx') === '1') {
    // 与 tools/preview.html 的模拟值一致，方便两边对照
    G.Runtime.debugSafeArea({
      statusBarHeight: 47, screenHeight: 844, safeArea: { bottom: 810 },
      capsule: { left: 279, top: 51, right: 366, bottom: 83, width: 87, height: 32 }
    });
  }

  G.Game.boot();

  // 字号档位：走真实设置通道（存储 + 重排），不是直接改 CFG
  var fontLv = q.get('font');
  if (fontLv !== null) G.Settings.set('fontLevel', parseInt(fontLv, 10) || 0);

  function place(list) {
    G.Game.energy = 99999;
    for (var i = 0; i < list.length; i++) {
      G.Game.selCard = list[i][2];
      G.Game.tryBuild(list[i][0], list[i][1]);
    }
    G.Game.selCard = null;
  }

  if (scene === 'menu') {
    /* 菜单页：&pts=（可选）塞满解锁档案，验收「回响」入口在已解锁档案下的样子。 */
    G.Game.reset();
    G.Game.state = 'menu';
    var mPts = parseInt(q.get('pts'), 10);
    if (mPts > 0 && G.Profile) {
      try {
        localStorage.setItem('echo_profile', JSON.stringify({
          pts: mPts, runs: 12, kills: 9000, wins: 6, best: 20, deepBest: 14, deep: 1
        }));
      } catch (e) { /* ignore */ }
      G.Profile.load();
      G.Profile.refresh();
      if (G.Runtime && G.Runtime.fit) G.Runtime.fit();
    }
  } else if (scene === 'game') {
    G.Game.startRun();
    /* 战斗展示图不需要被「首次遭遇」弹窗打断（本机存过 echo_seen 时它才会弹，
     * 弹不弹取决于上一次截图写下的记录 —— 那种「有时弹有时不弹」最坑）。
     * markAllSeen 只作用于本次会话，不动用户的记录。 */
    G.Codex.markAllSeen();
    // 抱团吃共振链 + 贴边吃反应节点，两种机制都能在图上看到
    place([[3, 5, 'pyro'], [4, 5, 'pyro'], [5, 5, 'hydro'],
      [6, 5, 'hydro'], [4, 6, 'electro'], [5, 6, 'electro'], [2, 8, 'pyro']]);
    // &lv=5：把塔全部升到指定等级，验收「等级越高越华丽」的塔身渲染
    var lvShot = parseInt(q.get('lv'), 10) || 0;
    if (lvShot > 1) {
      for (var li = 0; li < G.Game.towers.length; li++) {
        G.Game.towers[li].level = Math.min(lvShot, G.CFG.MAX_LEVEL);
      }
    }
    G.Game.startWave(true);
    for (var i = 0; i < 900; i++) G.Game.update(1 / 60);   // 15 秒，够打起来
    G.Game.energy = 415;
    G.Game.bannerT = 0;
    G.Game.toastT = 0;

  } else if (scene === 'monsters') {
    /* 怪物验收：棋盘上摆齐 6 种怪，各自推几步让走路/浮动动画进入稳态。
     * 只看 tools/monster-sheet.html 不够 —— 实际大小、光晕、血条、
     * 与塔和格子的叠压关系，只有放进真棋盘才看得出来。 */
    G.Game.startRun();
    place([[0, 5, 'pyro'], [9, 5, 'electro']]);   // 塔只摆在两侧，别压住要看的怪
    var kinds = ['drifter', 'sprinter', 'bulwark', 'sunder', 'phaser', 'boss'];
    for (var mi = 0; mi < kinds.length; mi++) {
      var em = G.Enemies.create(kinds[mi], 1, 2, 1);
      em.x = G.Grid.cellCX(1 + (mi % 3) * 3.2);
      em.y = G.LAY.boardY + G.CFG.CELL * (1.6 + Math.floor(mi / 3) * 2.4);
      em.spawnT = 0;
      em.hp = em.maxHp * (0.35 + 0.12 * mi);   // 血条能看出不同长度
      em.fx = mi === 1 ? -1 : 0.2;             // 疾行体朝左走，顺便验收镜像朝向
      em.fy = 0.4;
      G.Game.enemies.push(em);
    }
    for (var mf = 0; mf < 40; mf++) G.Game.update(1 / 60);
    /* &react=1：给每只怪挂一枚反应名标签，验收「反应打中时怪身上的名字」。
     * 真跑一遍反应节点要摆塔 + 等冷却，截图页不值得；直接调 tagReact，
     * 再推几帧让标签落到淡出的中段（不是刚出现、也不是已经消失）。 */
    if (q.get('react') === '1') {
      var tags = [['蒸发', '#ffd08a'], ['感电', '#b7a3ff'], ['超载', '#ff7bd0'],
        ['超导', '#8de8ff'], ['扩散', '#8af2e0'], ['燃烧', '#ffb347']];
      var en = G.Game.enemies;
      for (var ri = 0; ri < en.length && ri < tags.length; ri++) {
        G.Game.tagReact(en[ri], tags[ri][0], tags[ri][1]);
      }
      for (var rf = 0; rf < 8; rf++) G.Game.update(1 / 60);
    }
    G.Game.bannerT = 0;
    G.Game.toastT = 0;

  } else if (scene === 'monsters-effects') {
    /* 状态特效常驻文字标签验收：给 6 种怪各叠加不同控场状态，
     * 看「减速 / 击退 / 易伤 / 定身 / 燃烧」的小药丸是否真的贴在怪身下、
     * 且效果在就显示、消失才撤。直接设字段，不真跑反应节点（截图页不值得等冷却）。 */
    G.Game.startRun();
    place([[0, 5, 'pyro'], [9, 5, 'electro']]);
    G.Codex.markAllSeen();
    var meKinds = ['drifter', 'sprinter', 'bulwark', 'sunder', 'phaser', 'boss'];
    var meFx = [
      { slow: 1, kb: 1 },
      { slow: 1, burn: 1 },
      { kb: 1, super: 1 },
      { slow: 1, super: 1, burn: 1 },
      { kb: 1, stun: 1 },
      { slow: 1, kb: 1, super: 1, stun: 1, burn: 1 }
    ];
    for (var mei = 0; mei < meKinds.length; mei++) {
      var me = G.Enemies.create(meKinds[mei], 1, 2, 1);
      me.x = G.Grid.cellCX(1 + (mei % 3) * 3.2);
      me.y = G.LAY.boardY + G.CFG.CELL * (1.6 + Math.floor(mei / 3) * 2.4);
      me.spawnT = 0;
      me.hp = me.maxHp * (0.35 + 0.12 * mei);
      me.fx = 0.2; me.fy = 0.4;
      var fx = meFx[mei];
      if (fx.slow)  { me.slowAmt = 0.30; me.slowT = 999; }
      if (fx.kb)    { me.kbT = 0.5; me.kbvx = 0; me.kbvy = 0; me.kbImmune = 0; }
      if (fx.super) { me.superT = 3; }
      if (fx.stun)  { me.stunT = 1; }
      if (fx.burn)  { me.burnT = 4; me.burnDps = 8; }
      G.Game.enemies.push(me);
    }
    for (var mef = 0; mef < 12; mef++) G.Game.update(1 / 60);
    G.Game.bannerT = 0;
    G.Game.toastT = 0;

  } else if (scene === 'codex') {
    /* 图鉴验收：&tab=0|1（怪物 / 炮台）&sel=<key>（直接进详情）
     * &seen=drifter,sprinter（默认只解锁前两只 —— 剩下的格子会画成三个问号，
     * 正好验收「未遭遇」那一态；写成 seen=all 就全解锁）。
     * 注意：这里会重写本机 localStorage 里的 echo_seen，仅用于截图。 */
    G.Game.startRun();
    var seenArg = q.get('seen') || 'drifter,sprinter';
    G.Codex.reset();
    if (seenArg === 'all') {
      G.Codex.markAllSeen();
    } else {
      var seenList = seenArg.split(',');
      for (var si = 0; si < seenList.length; si++) if (seenList[si]) G.Codex.markSeen(seenList[si]);
    }
    G.Game.openCodex();
    var codexTab = parseInt(q.get('tab'), 10) || 0;
    G.Game.codexTab = codexTab;
    /* &pts=4200 → 先塞一份「满解锁」档案再进页面，用来截「已解锁」那一态
     * （三条线全绿 + 深渊开关亮起）；不给就是新玩家视角。
     * 注意：这会重写本机 localStorage 的 echo_profile，仅用于截图。 */
    var ptsArg = parseInt(q.get('pts'), 10);
    if (ptsArg > 0 && G.Profile) {
      try {
        localStorage.setItem('echo_profile', JSON.stringify({
          pts: ptsArg, runs: 12, kills: 9000, wins: 6, best: 20, deepBest: 14, deep: 1
        }));
      } catch (e) { /* 隐私模式下写不进去就算了，画出来还是未解锁态 */ }
      G.Profile.load();
      G.Profile.refresh();          // 会改写上架塔表（解锁凝霜 → 7 座）
      if (G.Runtime && G.Runtime.fit) G.Runtime.fit();
    }
    var codexSelKey = q.get('sel');
    if (codexSelKey) {
      var okSel = codexTab === 1 ? !!G.CFG.TOWERS[codexSelKey]
        : (!!G.CFG.ENEMIES[codexSelKey] && G.Codex.isSeen(codexSelKey));
      if (okSel) G.Game.codexSel = codexSelKey;
    }

  } else if (scene === 'pop') {
    /* 首次遭遇弹窗验收：&key=bulwark 指定弹哪只。
     * 正常路径是「刷出新怪 → 暂停 → 弹窗」，截图页不值得等一波怪，
     * 所以先打 4 秒把战场铺起来，再直接摆出暂停态 —— 遮罩下要看得见战场。 */
    G.Game.startRun();
    G.Game.startWave(true);
    for (var pf = 0; pf < 240; pf++) G.Game.update(1 / 60);
    var popK = q.get('key') || 'bulwark';
    if (G.CFG.ENEMIES[popK]) {
      G.Codex.markSeen(popK);
      G.Game.prevState = G.Game.state;
      G.Game.popKey = popK;
      G.Game.state = 'pop';
    }
    G.Game.bannerT = 0;
    G.Game.toastT = 0;

  } else if (scene === 'tech') {
    // 选中一座塔 → 打开塔面板，检查面板与 Toast 的字号
    G.Game.startRun();
    place([[4, 5, 'pyro'], [5, 5, 'hydro'], [4, 6, 'electro']]);
    var t0 = G.Game.towers[0];
    G.Game.onTap(t0.x, t0.y);       // 点塔身 = 选中（走真实命中逻辑）
    G.Game.toast('能量不足');

  } else if (scene === 'set' || scene === 'help') {
    // 整屏版式：设置页 / 玩法页。&font=0|1|2 可指定字号档位一起拍
    G.Game.startRun();
    G.Game.openPage(scene);
    G.Game.toastT = 0;   // startRun 的开局提示会淡走，截图里不需要

  } else if (scene === 'over' || scene === 'win') {
    G.Game.startRun();
    G.Game.state = scene;
    G.Game.score = 18420; G.Game.kills = 476; G.Game.leaked = 3;
    G.Game.wave = scene === 'win' ? 20 : 14; G.Game.best = 21300;
    /* &gain=644 造一份本局结算（含 &unlock=muts 时再挂一条「新解锁」提示）。
     * 不造的话 lastGain 为 null，画面会画成「+0」——那测不出这一行到底长什么样。 */
    var gainArg = parseInt(q.get('gain'), 10);
    if (gainArg > 0 && G.Profile) {
      var unl = [];
      var uKey = q.get('unlock');
      if (uKey) {
        for (var ui = 0; ui < G.CFG.UNLOCKS.length; ui++) {
          if (G.CFG.UNLOCKS[ui].key === uKey) unl.push(G.CFG.UNLOCKS[ui]);
        }
      }
      G.Game.lastGain = { gain: gainArg, unlocked: unl, changed: false };
    }
  }

  G.Render.draw(G.Game);

  // 同步阶段就把画面定格成 PNG 交给 DOM，避免和 rAF 抢时机
  document.getElementById('out').textContent = G.Runtime.canvas.toDataURL('image/png');
})();
</script>
</body>
</html>
